name: Release

# Publishes to npm when a version tag is pushed, using npm's trusted publishing
# (OIDC). There is no NPM_TOKEN and no secret of any kind: the runner proves its
# identity to npm with a short-lived GitHub OIDC token, and npm checks that
# against a trusted publisher registered on the package.
#
# Tokens were tried first and never worked. A classic Publish token and a
# replacement token both failed at the publish step with npm's EOTP, because
# 2FA on writes rejects any credential without an explicit bypass — a classic
# *Automation* token, or a granular token with "Bypass 2FA" set, which is off
# by default and which the old comment here did not mention. Trusted publishing
# removes the credential entirely, so there is nothing to choose wrongly,
# rotate, or leak.
#
# One-time setup on npmjs.com — package -> Settings -> Trusted publisher:
#   Organization or user:  northernRough
#   Repository:            HC3_mcp
#   Workflow filename:     release.yml      (the filename, with extension)
#   Environment:           leave blank
#   Allowed actions:       npm publish
#
# Three things that will bite otherwise:
#   1. GitHub creates NO event when more than three tags are pushed at once.
#      `git push origin v1 v2 v3 v4` publishes nothing, silently: no run
#      appears and no warning is given. Push tags one at a time, or use the
#      workflow_dispatch input below.
#   2. npm matches the workflow FILENAME registered above. If this file is ever
#      renamed or moved, update the trusted publisher first or every publish
#      fails authentication.
#   3. OIDC does not work on self-hosted runners, only GitHub-hosted ones.
#
# Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 22 ships
# npm 10, which has no OIDC support at all, so npm is upgraded explicitly below
# rather than inherited from whatever the runner image happens to carry.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v4.19.2)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # mints the OIDC token npm verifies. Without
                               # this the publish fails as an auth error, with
                               # nothing in the message about OIDC.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Fail here rather than after two minutes of tests with an npm error that
      # reads like a credential problem. This variable is only present when the
      # job actually holds id-token: write, so it tests the permission rather
      # than trusting that the block above was not edited away.
      - name: OIDC must be available to this job
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token endpoint. This job needs permissions: id-token: write."
            exit 1
          fi
          echo "OIDC token endpoint is present"

      # NOTE THE ABSENCE OF registry-url. Supplying it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and export NODE_AUTH_TOKEN as the placeholder XXXXX-XXXXX-XXXXX-XXXXX.
      # npm then believes it holds credentials, never attempts the OIDC
      # exchange, and publishes with a junk token — which the registry answers
      # with a 404 that reads as "package not found" rather than "bad auth".
      # That cost one release run here. npm defaults to registry.npmjs.org
      # anyway, so the setting bought nothing. actions/setup-node#1551.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm must be new enough to speak OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      # The tag is the release's identity. If it disagrees with package.json,
      # something was tagged wrong and publishing would put the wrong version
      # on the registry under the wrong name — refuse rather than guess.
      - name: Tag must match package.json version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG. Refusing to publish."
            exit 1
          fi

      # Same gates as CI. A release must not be the one build nobody checked.
      - run: npm run lint
      - run: npm test
      - run: node scripts/check-release-hygiene.mjs

      - name: Refuse to republish an existing version
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already on the registry. Versions are immutable; bump first."
            exit 1
          fi
          echo "$NAME@$PKG is not yet published"

      # The claims npm matches a trusted publisher against. Printed because an
      # OIDC mismatch surfaces as ENEEDAUTH, which says "you are not logged in"
      # and names nothing that could be compared against the registration. The
      # token itself is never printed — only the claim fields, which are not
      # secret and are exactly what the npmjs.com form is asking for.
      - name: What identity is being offered to npm
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          echo "$RESP" | python3 -c '
import sys, json, base64
tok = json.load(sys.stdin).get("value", "")
if not tok:
    print("no OIDC token returned"); raise SystemExit(0)
p = tok.split(".")[1]; p += "=" * (-len(p) % 4)
c = json.loads(base64.urlsafe_b64decode(p))
for k in ("repository", "repository_owner", "job_workflow_ref", "workflow_ref", "ref", "event_name", "aud"):
    print(f"  {k}: {c.get(k)}")
'

      # No NODE_AUTH_TOKEN: npm detects the OIDC environment on its own.
      # Provenance attestations are generated automatically on this path, so
      # --provenance is not passed. Verbose because a failure here is an
      # authentication dead end otherwise.
      - name: Publish
        run: npm publish --access public --loglevel verbose

      - name: Confirm it resolves
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view "$NAME@$PKG" version 2>/dev/null)" = "$PKG" ]; then
              echo "published and resolvable: $NAME@$PKG"; exit 0
            fi
            echo "  not visible yet, retrying ($i/6)"; sleep 10
          done
          echo "::error::Published but $NAME@$PKG never became resolvable."
          exit 1
