name: Release

# Publishes to npm when a version tag is pushed. Tagging is already the habit
# here, so a release becomes `git push origin vX.Y.Z` and nothing else.
#
# This exists because npm requires a one-time password for interactive
# publishes on a 2FA account, which cannot be supplied from a script. An npm
# *automation* token bypasses that — it is the supported mechanism for CI, and
# it lives in a GitHub secret rather than on anyone's laptop.
#
# One-time setup:
#   1. npmjs.com -> Access Tokens -> Generate New Token -> **Automation**
#      (Granular tokens also work; they need "Read and write" on this package.)
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name NPM_TOKEN, paste the token.
# The token is never printed, and never leaves GitHub's secret store.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v4.17.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag is the release's identity. If it disagrees with package.json,
      # something was tagged wrong and publishing would put the wrong version
      # on the registry under the wrong name — refuse rather than guess.
      - name: Tag must match package.json version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG. Refusing to publish."
            exit 1
          fi

      # Same gates as CI. A release must not be the one build nobody checked.
      - run: npm run lint
      - run: npm test
      - run: node scripts/check-release-hygiene.mjs

      - name: Refuse to republish an existing version
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already on the registry. Versions are immutable; bump first."
            exit 1
          fi
          echo "$NAME@$PKG is not yet published"

      - name: Publish
        run: npm publish --access public
        env:
          # An automation token carries its own 2FA bypass, so no OTP prompt.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm it resolves
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view "$NAME@$PKG" version 2>/dev/null)" = "$PKG" ]; then
              echo "published and resolvable: $NAME@$PKG"; exit 0
            fi
            echo "  not visible yet, retrying ($i/6)"; sleep 10
          done
          echo "::error::Published but $NAME@$PKG never became resolvable."
          exit 1
